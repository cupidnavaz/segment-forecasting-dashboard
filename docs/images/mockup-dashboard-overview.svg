<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Segment Forecasting Dashboard overview</title>
  <desc id="desc">Dashboard command center with summary metrics, revenue and profit bars, and a revenue mix donut chart.</desc>
  <rect width="1600" height="1000" fill="#f7f9fc"/>
