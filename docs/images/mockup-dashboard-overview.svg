      <g transform="translate(670 350)"><rect width="260" height="116" rx="14" fill="#fff" stroke="#dce3eb"/><text x="20" y="35" font-size="18" fill="#64748b">Avg Growth</text><text x="20" y="86" font-size="38">23.6%</text></g>
      <g transform="translate(950 350)"><rect width="260" height="116" rx="14" fill="#fff" stroke="#dce3eb"/><text x="20" y="35" font-size="18" fill="#64748b">Avg Confidence</text><text x="20" y="86" font-size="38">67%</text></g>
      <g transform="translate(1230 350)"><rect width="260" height="116" rx="14" fill="#fff" stroke="#dce3eb"/><text x="20" y="35" font-size="18" fill="#64748b">High Risk</text><text x="20" y="86" font-size="38">3</text></g>
