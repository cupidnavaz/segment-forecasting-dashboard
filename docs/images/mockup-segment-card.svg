    <g font-size="16"><text x="28" y="215">Risk</text><rect x="28" y="230" width="197" height="42" rx="8" fill="#f8fafc"/><text x="45" y="257">all</text><text x="28" y="315">Status</text><rect x="28" y="330" width="197" height="42" rx="8" fill="#f8fafc"/><text x="45" y="357">all</text><text x="28" y="415">Trend</text><rect x="28" y="430" width="197" height="42" rx="8" fill="#f8fafc"/><text x="45" y="457">all</text><text x="28" y="515">Search segment or period</text><rect x="28" y="530" width="197" height="42" rx="8" fill="#f8fafc"/><text x="28" y="615">Sort by</text><rect x="28" y="630" width="197" height="42" rx="8" fill="#f8fafc"/><text x="45" y="657">scenario_growth</text><text x="60" y="718">◯ Ascending</text></g>
    <line x1="28" y1="770" x2="225" y2="770" stroke="#d1d5db"/><rect x="28" y="800" width="197" height="48" rx="8" fill="#fff" stroke="#d1d5db"/><text x="73" y="831" font-size="16">Reset dataset</text>
