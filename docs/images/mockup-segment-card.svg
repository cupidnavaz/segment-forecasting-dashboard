    </g>
    <g transform="translate(1240 230)" font-size="17" fill="#1f2937"><g><line x1="0" y1="0" x2="30" y2="0" stroke="#0969b5" stroke-width="6"/><text x="42" y="6">Tech &amp; SaaS</text></g><g transform="translate(0 42)"><line x1="0" y1="0" x2="30" y2="0" stroke="#65b9e8" stroke-width="6"/><text x="42" y="6">Financial Services</text></g><g transform="translate(0 84)"><line x1="0" y1="0" x2="30" y2="0" stroke="#ef4444" stroke-width="6"/><text x="42" y="6">Logistics</text></g><g transform="translate(0 126)"><line x1="0" y1="0" x2="30" y2="0" stroke="#f49ba1" stroke-width="6"/><text x="42" y="6">Retail &amp; E-Commerce</text></g><g transform="translate(0 168)"><line x1="0" y1="0" x2="30" y2="0" stroke="#26a69a" stroke-width="6"/><text x="42" y="6">Energy &amp; Utilities</text></g></g>
    <line x1="325" y1="805" x2="1510" y2="805" stroke="#cbd5e1"/><text x="325" y="850" font-size="16" fill="#64748b">Source lineage: rebuilt from the supplied ultramodern.html dashboard. Market ticker values are static fixtures and are not live market data.</text>
