      <line x1="325" y1="50" x2="325" y2="550" stroke="#b6b6b6"/><line x1="75" y1="300" x2="575" y2="300" stroke="#b6b6b6"/><line x1="135" y1="120" x2="515" y2="480" stroke="#b6b6b6"/><line x1="135" y1="480" x2="515" y2="120" stroke="#b6b6b6"/>
      <polygon points="325,300 400,92 520,300 410,402 325,468 190,390 150,150" fill="#1474c8" fill-opacity=".32" stroke="#0969b5" stroke-width="4"/><polygon points="325,300 385,135 490,300 395,380 325,430 205,372 175,170" fill="#80c9f5" fill-opacity=".30" stroke="#65b9e8" stroke-width="3"/><polygon points="325,300 360,170 470,300 390,375 325,410 215,365 195,180" fill="#25a89b" fill-opacity=".24" stroke="#26a69a" stroke-width="3"/><polygon points="325,300 350,180 465,300 385,365 325,398 205,375 185,170" fill="#ef5a60" fill-opacity=".18" stroke="#ef4444" stroke-width="3"/><polygon points="325,300 340,195 460,300 380,360 325,388 210,380 180,178" fill="#f6a0a5" fill-opacity=".15" stroke="#f49ba1" stroke-width="3"/>
